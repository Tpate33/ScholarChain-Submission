# ScholarChain scalafmt configuration. Owner: build-engineer.
# The version below must equal `scalafmt` in project/versions.properties
# (enforced by `sbt verifyVersionLedger`, part of `sbt check`).
version = "3.9.4"
runner.dialect = scala3
maxColumn = 100
align.preset = none
docstrings.style = Asterisk
rewrite.scala3.convertToNewSyntax = false
rewrite.scala3.removeOptionalBraces = false

fileOverride {
  # sbt build definitions are Scala 2.12 (sbt 1.x meta-build).
  "glob:**/*.sbt" {
    runner.dialect = sbt1
  }
  "glob:**/project/*.scala" {
    runner.dialect = scala212
  }
}
