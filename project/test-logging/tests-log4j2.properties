# Bounded logging for the forked `tests` Test JVM (owner build-engineer, BE-P10-01).
# Passed by build.sbt as -Dlog4j2.configurationFile, together with -Dslf4j.provider naming the
# log4j2 SLF4J provider: the tests Test classpath holds two SLF4J 2 providers (logback-classic
# through services, log4j-slf4j2-impl through Spark), and logback without a configuration file
# logs everything at DEBUG. A tests/src/test/resources/log4j2-test.* file (test-engineer) takes
# precedence: build.sbt then omits this file. Warnings and errors only; test results and failures
# are reported by the test framework, not by this logger. verifyTestLogging (part of check)
# fails unless the root level here is warn, error or off.
# Deliberately not named log4j2*.properties, so no tool discovers it on a classpath by name.
status = warn
rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %p %c: %m%n
