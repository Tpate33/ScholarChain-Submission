# ScholarChain version ledger (single source of every pinned version).
# Structure owner: build-engineer. Value maintenance: dependency-updater (gap G5).
# Values only: one `key=value` per line, exact versions, never latest, SNAPSHOT,
# RELEASE, ranges, or `+`. project/Ledger.scala (main build) and project/plugins.sbt
# (meta-build, before plugins resolve) reject such values at build load.
# Tool-mandated mirrors (kept equal by `sbt verifyVersionLedger`, part of `sbt check`):
#   sbt      -> project/build.properties (sbt.version)
#   scalafmt -> .scalafmt.conf (version)

# --- Toolchain --------------------------------------------------------------
sbt=1.11.7
scala=3.3.6
scalafmt=3.9.4

# --- sbt plugins (project/plugins.sbt) --------------------------------------
plugin.sbt-scalafmt=2.5.5
plugin.sbt-assembly=2.3.1
plugin.sbt-native-packager=1.11.1

# --- Libraries ----------------------------------------------------------------
upickle=4.1.0
munit=1.1.1
slf4j=2.0.17
logback=1.5.18
typesafe-config=1.4.3
# junit: NOT a declared dependency (junit:junit arrives transitively through munit). The
# expected revision, asserted by sbt sparkIT and verifySparkItRunner (part of sbt check): the
# sparkIT runner reaches JUnit 4 by reflection with API names verified against this revision.
# A munit change that moves junit:junit makes check fail until the runner is re-verified.
junit=4.13.2

# --- Cluster runtimes (Provided scope) ----------------------------------------
# hadoop: Hadoop 3.4.x line, Java client API artifacts.
# spark: the build uses org.apache.spark:spark-sql_2.13. This does NOT assert that
# EMR supplies that artifact: EMR 7.x Spark is understood to be built for Scala 2.12.
# Runtime target pending human decision (review F2) before Phase 6.
hadoop=3.4.1
spark=3.5.5

# --- EMR Option A Spark runtime (BE-P6-09; human order prompt-emr-preparation.md) ---
# Used by `sbt sparkSubmitLocal` and `sbt packageJobs` (project/SparkSubmitLocal.scala) and by the
# EMR staging. Values from docs/agent-runs/phase-06/emr-docs-research-03.md (orchestrator web
# fetch of archive.apache.org and repo1.maven.org), unless marked. New pins: confirmation by the
# human or dependency-updater is pending.
# spark.distribution.*: the Apache binary distribution for Scala 2.13 (sha512 from its .sha512 file;
#   the .asc signature is NOT verified). Its file name must be spark-<spark>-bin-hadoop3-scala2.13.tgz.
# spark.distribution.scala-library / hadoop-client: what the distribution's jars/ is expected to
#   hold; sparkSubmitLocal refuses when the extracted jars/ names differ. scala-library 2.13.8 is NOT
#   yet verified (first observed by the first sparkSubmitLocal run); hadoop-client 3.3.4 is the
#   Spark 3.5.5 pom's hadoop.version.
# spark.runtime.scala-library: the scala-library put first on the driver and executor classpath:
#   the revision scala3-library_3 (scala above) depends on (its POM: 2.13.16); packageJobs and
#   sparkSubmitLocal refuse when the resolved revision differs.
# hadoop-aws.s3a, aws-sdk-bundle.s3a: S3A for the distribution's Hadoop client (hadoop-aws 3.3.4 POM
#   names aws-java-sdk-bundle 1.12.262); the hadoop-aws jar sha1 is from Maven Central's .sha1 file.
#   No checksum is pinned for the SDK bundle or scala-library (Coursier checks Maven Central's
#   checksum files on download; sparkSubmitLocal records each jar's sha256 in inventory.txt).
spark.distribution.url=https://archive.apache.org/dist/spark/spark-3.5.5/spark-3.5.5-bin-hadoop3-scala2.13.tgz
spark.distribution.file=spark-3.5.5-bin-hadoop3-scala2.13.tgz
spark.distribution.sha512=a462656d2a87afcf81f24e4dea9a99e6666ed5c8ff7ba0cc9c936188498c549cf852d0ebb475325761d6cf645d1184d527be9a609503d587bb47d5532b533aa1
spark.distribution.scala-library=2.13.8
spark.distribution.hadoop-client=3.3.4
spark.runtime.scala-library=2.13.16
hadoop-aws.s3a=3.3.4
hadoop-aws.s3a.jar-sha1=a65839fbf1869f81a1632e09f415e586922e4f80
aws-sdk-bundle.s3a=1.12.262

# --- Container runtime base image (pinned tag; digest pending, see report) ---
docker.java-runtime-image=eclipse-temurin:17.0.17_10-jre-noble
