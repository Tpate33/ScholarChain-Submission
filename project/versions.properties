# ScholarChain version ledger (single source of every pinned version).
# Structure owner: build-engineer. Value maintenance: dependency-updater (gap G5).
# Values only: one `key=value` per line, exact versions, never latest, SNAPSHOT,
# RELEASE, ranges, or `+`. project/Ledger.scala (main build) and project/plugins.sbt
# (meta-build, before plugins resolve) reject such values at build load.
# Tool-mandated mirrors (kept equal by `sbt verifyVersionLedger`, part of `sbt check`):
#   sbt      -> project/build.properties (sbt.version)
#   scalafmt -> .scalafmt.conf (version)

# --- Toolchain --------------------------------------------------------------
sbt=1.11.7
scala=3.3.6
scalafmt=3.9.4

# --- sbt plugins (project/plugins.sbt) --------------------------------------
plugin.sbt-scalafmt=2.5.5
plugin.sbt-assembly=2.3.1
plugin.sbt-native-packager=1.11.1

# --- Libraries ----------------------------------------------------------------
upickle=4.1.0
munit=1.1.1
slf4j=2.0.17
logback=1.5.18
typesafe-config=1.4.3

# --- Cluster runtimes (Provided scope) ----------------------------------------
# hadoop: Hadoop 3.4.x line, Java client API artifacts.
# spark: the build uses org.apache.spark:spark-sql_2.13. This does NOT assert that
# EMR supplies that artifact: EMR 7.x Spark is understood to be built for Scala 2.12.
# Runtime target pending human decision (review F2) before Phase 6.
hadoop=3.4.1
spark=3.5.5

# --- Container runtime base image (pinned tag; digest pending, see report) ---
docker.java-runtime-image=eclipse-temurin:17.0.17_10-jre-noble
