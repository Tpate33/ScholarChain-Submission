# Dev collaboration-analysis configuration (SP-P6-02 step 1; owner spark-engineer). DEV ONLY.
# Read from the test classpath by the sparkIT suite (and checked by a routine suite) through
# ConfigLoader.resolve with an empty environment. Nothing is called: aws, storage and models are
# dummy, non-secret placeholders. The entityResolution values repeat the accepted Phase 5 settings
# only because the loader requires every key; the analysis reads the grouping policy from the
# grouping run, not from here.
#
# graph.windows: two explicit windows with one inclusion rule (a counted work belongs to a window
# when its year lies in [startYear, endYear], inclusive; a work without a year belongs to none):
#   1970-2026, every year of the dev grouping run's counted works (1974..2026);
#   2020-2024, a recent sub-window. The windows overlap by design and are never summed.
# bridge.* and community.* are recorded for later steps (cross-community degree, label
# propagation); step 1 computes neither.
configSchemaVersion = "scholarchain.config.v2"
environment = dev-local
aws { region = "us-east-1", accountId = "000000000000" }
storage {
  rawBucket = "dummy-raw-bucket"
  curatedBucket = "dummy-curated-bucket"
  contextBucket = "dummy-context-bucket"
  vectorBucket = "dummy-vector-bucket"
  vectorIndex = dummy-index
  dynamoTablePrefix = dummy
  neptuneEndpoint = "dummy-neptune.invalid"
  openSearchEndpoint = null
}
models {
  llmModelId = "dummy-llm-model.not-called"
  embeddingModelId = "dummy-embedding-model"
  embeddingDimension = 8
}
graph {
  windows = [{ startYear = 1970, endYear = 2026 }, { startYear = 2020, endYear = 2024 }]
  policyVersion = "sc-graph.v1"
  identityVersion = v1
}
bridge { algorithm = cross-community-degree, sampleSize = 1, randomSeed = 0, maxIterations = 1 }
community { algorithm = label-propagation, maxIterations = 20 }
entityResolution {
  policyVersion = "er-policy.v8"
  acceptThreshold = 0.85
  rejectThreshold = 0.2
  llmBandLower = 0.4
  llmBandUpper = 0.7
  promptVersion = "er-adjudication-prompt.v2"
}
runtime { maxPathHops = 3, retrievalTopK = 5, defaultWindow = { startYear = 2020, endYear = 2024 } }
analysis {
  maxPathHops = 4
  maxPathsPerPair = 3
  maxEvidenceWorksPerHop = 3
  exportFormat = parquet
}
