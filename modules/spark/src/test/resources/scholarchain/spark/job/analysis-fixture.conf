# Fixture collaboration-analysis configuration of the job entry-point suite (SP-P6-04; owner
# spark-engineer). TEST ONLY: the values of RunFixtures.config (windows 2015-2019 and 2020-2024)
# plus the path-length keys of LogicalReproducibilitySuite (sample size 2, seed 11, minimum
# component size 2). aws, storage and models are dummy, non-secret placeholders; nothing is called.
configSchemaVersion = "scholarchain.config.v2"
environment = test
aws { region = "us-east-1", accountId = "000000000000" }
storage {
  rawBucket = "dummy-raw-bucket"
  curatedBucket = "dummy-curated-bucket"
  contextBucket = "dummy-context-bucket"
  vectorBucket = "dummy-vector-bucket"
  vectorIndex = dummy-index
  dynamoTablePrefix = dummy
  neptuneEndpoint = "dummy-neptune.invalid"
  openSearchEndpoint = null
}
models {
  llmModelId = "dummy-llm-model.not-called"
  embeddingModelId = "dummy-embedding-model"
  embeddingDimension = 8
}
graph {
  windows = [{ startYear = 2015, endYear = 2019 }, { startYear = 2020, endYear = 2024 }]
  policyVersion = "sc-graph.v1"
  identityVersion = v1
}
bridge { algorithm = cross-community-degree, sampleSize = 1, randomSeed = 0, maxIterations = 1 }
community { algorithm = label-propagation, maxIterations = 20 }
entityResolution {
  policyVersion = "er-policy.v8"
  acceptThreshold = 0.85
  rejectThreshold = 0.2
  llmBandLower = 0.4
  llmBandUpper = 0.7
  promptVersion = "er-adjudication-prompt.v2"
}
runtime { maxPathHops = 3, retrievalTopK = 5, defaultWindow = { startYear = 2020, endYear = 2024 } }
analysis {
  maxPathHops = 4
  maxPathsPerPair = 3
  maxEvidenceWorksPerHop = 3
  exportFormat = parquet
  pathLengthSampleSize = 2
  pathLengthSeed = 11
  pathLengthMinComponentSize = 2
}
