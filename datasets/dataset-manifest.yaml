      api_base: "https://api.openalex.org"
      documentation:
        - "https://help.openalex.org/access/snapshot/"
        - "https://help.openalex.org/tutorials/download-the-snapshot/"
        - "https://openalex.s3.amazonaws.com/RELEASE_NOTES.txt"
    license:
