        source: "manifest.json files at https://openalex.s3.amazonaws.com/data/jsonl/ (read 2026-10-29)"
        jsonl_total_bytes: 755513952946
        jsonl_total_records: 586176148
        works_bytes: 675298563638
        works_records: 464765485
        authors_bytes: 74121890690
        authors_records: 101066311
        authors_files: 517
        institutions_bytes: 200441980
        institutions_records: 143455
        help_page_note: "The help page gives about 1.5 TB for the whole bucket (JSONL, Parquet and legacy-data) and about 626 million records per format. Those figures cite a September 2026 release and differ from the 2026-10-14 manifests above."
      observed:
        bytes: null
        status: "pending-human-download"
    raw_prefix: "s3://{raw_bucket}/raw/openalex/snapshot_date=2026-10-14/"
    integrity:
      method: "Per-part content_length and record_count from the per-entity manifest.json, checked after copy. SHA-256 computed per copied part and stored in a run manifest."
      upstream_checksum:
        algorithm: none
        value: null
        note: "The snapshot documentation does not mention checksums or ETags."
      our_sha256: "pending-human-download"
      etag_policy: "ETags of s3://openalex objects may be recorded as change detectors only, never as content hashes."
    schema_version: "openalex-raw/1.0.0"
    upstream_schema_version: "OpenAlex snapshot release 2026-10-14 (no separate schema version is published on the pages read)"
    schema_notes: "datasets/schemas/openalex.md"
    subset_rule: "Entities: works, authors, institutions (sources and topics optional). Works are kept when their normalized DOI is in the DBLP subset's DOI set (Hadoop join). Authors and institutions are kept when referenced by kept works. How much of the raw works entity is copied into the raw zone (about 675 GB compressed for all works, or a narrower API-based extraction) is an open human cost decision."
    update_strategy: "Quarterly public releases ('second Wednesday of January, April, July and October'). A new release gets a new snapshot_date prefix. Within a release, updated_date partitions allow copying only partitions newer than the previous release. works/deleted_ids.csv.gz must be applied."
    linkage_fields:
      - "doi (https://doi.org/ prefix stripped, lowercased)"
      - "openalex_work_id"
      - "openalex_author_id"
      - "author_orcid"
      - "institution_ror"
      - "normalized_title"
      - "publication_year"
      - "author_sequence (author_position plus array order)"
      - "source issn_l"
    source_identifiers:
      - name: openalex_work_id
        format: "https://openalex.org/W<digits>"
        example: "https://openalex.org/W3147033813"
      - name: openalex_author_id
        format: "https://openalex.org/A<digits> (nullable inside authorships)"
        example: "https://openalex.org/A5113870699"
      - name: openalex_institution_id
        format: "https://openalex.org/I<digits>"
        example: "https://openalex.org/I120250893"
      - name: openalex_source_id
        format: "https://openalex.org/S<digits>"
        example: "https://openalex.org/S103482838"
      - name: openalex_topic_id
        format: "https://openalex.org/T<digits>"
        example: "https://openalex.org/T10772"
      - name: doi
        format: "https://doi.org/<doi>"
        example: "https://doi.org/10.1145/2491245"
      - name: orcid
        format: "https://orcid.org/<iD>"
        example: "https://orcid.org/0000-0002-2814-962X"
      - name: ror
        format: "https://ror.org/<9 characters>"
        example: "https://ror.org/00e5k0821"
    personal_data:
      contains_personal_data: true
      fields:
        - "author display names and name alternatives"
        - "author ORCID iDs (asserted by OpenAlex)"
        - "author-to-institution affiliations and countries"
      handling:
        - "Keep only the fields in datasets/schemas/openalex.md; no contact data is used."
        - "Affiliations are kept at institution level (ID, ROR) for the institution filter."
        - "OpenAlex ORCID assertions are evidence with provenance, never ground truth."
    limitations:
      - "A matching author name is not sufficient evidence of author identity."
      - "Titles may be truncated relative to the publisher title (Spanner is stored as 'Spanner')."
      - "authorships[].author.id can be null (3 of 26 Spanner authorships)."
      - "OpenAlex attaches ORCID iDs that neither DBLP nor ORCID corroborate (6 Spanner authors; no ORCID record claims that DOI)."
      - "display_name may differ from raw_author_name (e.g. 'Wilson Cheng-yi Hsieh' versus 'Wilson Hsieh')."
      - "Counts (works_count, cited_by_count) and updated_date change between releases."
      - "No upstream checksums are published."
    validation_commands:
      - "datasets/scripts/validate-manifest.sh --verify"
      - "datasets/scripts/fetch-openalex.sh --verify"
    owning_agent: dataset-engineer
    samples:
      - "datasets/samples/openalex/works-sample.jsonl"
      - "datasets/samples/openalex/authors-sample.jsonl"
      - "datasets/samples/openalex/institutions-sample.jsonl"
    unverified:
      - item: "API access conditions for api.openalex.org (rate limits, key requirements) for anything beyond the bounded sample"
        reason: "Not checked in this run; only single-record requests were made."
