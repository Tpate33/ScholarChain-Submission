# ScholarChain dataset manifest. Owner: dataset-engineer.
# Written in the strict YAML subset parsed by datasets/scripts/dsutil.py: block mappings and lists,
# double-quoted strings, integers, true/false/null. Every value that could not be verified against an
# official source on the verification date says UNVERIFIED and is listed under that dataset's
# "unverified" key with a reason. Observed sizes and our SHA-256 values of full corpora stay
# "pending-human-download" until the human runs the download and records the observed values.
# Validate with: datasets/scripts/validate-manifest.sh --verify
manifest_version: "1.0.0"
owning_agent: dataset-engineer
last_reviewed: "2026-11-12"
raw_prefix_template: "s3://{raw_bucket}/raw/{dataset}/snapshot_date={snapshot_date}/"
raw_bucket_note: "{raw_bucket} is external configuration. No bucket name, account ID, ARN, or endpoint of ScholarChain infrastructure is recorded here. It is resolved through the configuration contract (domain-engineer) and provisioned through Terraform (infra-engineer). Raw prefixes are immutable: a new snapshot always gets a new snapshot_date prefix."
identity_policy: "A matching author name is never evidence of identity. ORCID iDs asserted by DBLP, OpenAlex, Crossref or ORCID itself are evidence with provenance (who asserted it, when), not ground truth. Match features, policy and thresholds belong to entity-resolution-engineer."
selection:
  seed: dblp
  enrichment:
    - openalex
    - orcid
    - crossref
  rationale: "This follows the course specification's recommended minimum portfolio (DBLP plus OpenAlex, ORCID, and either Crossref or Semantic Scholar). OpenAlex contributes candidate author IDs, institutions (ROR) and topics. ORCID contributes self-curated researcher identity and DOI claims. Crossref is DOI-centred publisher metadata (title/subtitle, author sequence, venue, ISSN), and its reuse statement was verified on the official site. All four share DOI as the primary work linkage key, and three of the four carry ORCID iDs."
  not_selected:
    - name: semantic-scholar
      reason: "Optional alternative to Crossref in the spec. Its dataset access and licence terms were not verified in this run, so it is not selected. Revisit only with verified terms."
    - name: opencitations
      reason: "Optional enrichment (citation edges). Citation metrics are not required research metrics for this version of the project."
    - name: arxiv
      reason: "Optional enrichment (preprints, abstracts). Not needed for coauthorship analysis."
    - name: s2orc
      reason: "Optional enrichment (full text). Not needed for coauthorship analysis."
    - name: papers-with-code
      reason: "Optional enrichment (code links). Not needed for coauthorship analysis."
samples:
  checksum_file: "datasets/samples/SHA256SUMS"
  attribution_file: "datasets/samples/ATTRIBUTION.md"
  kind: "Field-level excerpts of real upstream records, transcribed from official APIs on 2026-10-29 into each dataset's own record vocabulary. They are not byte copies of dump files. Byte-exact copies of the same seed records are fetched by datasets/scripts/fetch-samples.sh --sample into datasets/downloads/."
  overlap: "Three works overlap across DBLP, OpenAlex and Crossref via DOI (10.1145/2491245, 10.1145/3447741, 10.1145/3453932). Two of them also link to ORCID records via DOI claims. One DBLP work (conf/osdi/ChangDGHWBCFG06) has no DOI."
download_area: "datasets/downloads/<dataset>/ holds fetched, uncommitted data (sample and full downloads). It is git-ignored by the existing /datasets/downloads/ rule in .gitignore (human-confirmed 2026-10-28) and pruned by project/BuildGuard.scala. The scripts refuse any output directory outside datasets/downloads/."
datasets:
  dblp:
    name: "dblp computer science bibliography (XML dump)"
    required: true
    purpose: "Mandatory seed. Computer-science publication records with DBLP keys, ordered author sequences, titles, venues, years, and electronic-edition links (DOIs). They are the source of WorkRecord, AuthorMention and coauthor-pair candidates."
    official_source:
      landing_page: "https://dblp.org/xml/"
      download_url: "https://drops.dagstuhl.de/storage/artifacts/dblp/xml/2026/dblp-2026-10-03.xml.gz"
      checksum_url: "https://drops.dagstuhl.de/storage/artifacts/dblp/xml/2026/dblp-2026-10-03.xml.gz.md5"
      release_page: "https://drops.dagstuhl.de/entities/artifact/10.4230/dblp.xml.2026-10-03"
      release_doi: "10.4230/dblp.xml.2026-10-03"
      release_collection: "https://drops.dagstuhl.de/entities/collection/10.4230/dblp.xml"
      rolling_url: "https://dblp.org/xml/dblp.xml.gz"
      dtd_url: "https://dblp.org/xml/dblp.dtd"
      documentation:
        - "https://dblp.org/xml/README.txt"
        - "https://dblp.org/xml/CHANGES.txt"
        - "https://dblp.org/xml/dblp.dtd"
        - "https://sparql.dblp.org/sparql"
    license:
      name: "CC0 1.0 Universal (public domain dedication); ODC-BY 1.0 offered as a secondary licence"
      url: "https://creativecommons.org/publicdomain/zero/1.0/"
      verified_from:
        - "https://dblp.org/xml/README.txt"
        - "https://drops.dagstuhl.de/entities/artifact/10.4230/dblp.xml.2026-10-03"
        - "https://drops.dagstuhl.de/entities/collection/10.4230/dblp.xml"
      verified_on: "2026-10-29"
      quote: "dblp - Legal Information: metadata ... is released under the CC0 1.0 Public Domain Dedication license; all metadata is also released under Open Data Commons ODC-BY 1.0 license as a secondary license."
      redistribution: "Allowed (CC0). Samples may be committed."
      attribution: "Not legally required under CC0. Credit 'dblp computer science bibliography, Schloss Dagstuhl' as good practice."
      notes: "https://dblp.org/db/about/copyright.html could not be read by the verification tool (bot-protection page). The same legal text was read from https://dblp.org/xml/README.txt."
    snapshot:
      id: "dblp-2026-10-03"
      date: "2026-10-03"
      date_meaning: "Publication date of the dated monthly release on Dagstuhl DROPS (DOI 10.4230/dblp.xml.2026-10-03). The rolling dblp.org/xml/dblp.xml.gz changes daily and is not used for reproducible runs."
      retrieval_date: "2026-11-12"
      status: "downloaded-and-verified"
      retrieved_by: "The human ran the pinned download (SCHOLARCHAIN_CONFIRM_FULL_DOWNLOAD=dblp-2026-10-03 datasets/scripts/fetch-dblp.sh --full) on 2026-11-12 from the reviewed script checkpoint, commit 5e324bd, then ran datasets/scripts/fetch-dblp.sh --verify (human report decisions-12.md: 110 manifest checks, 0 failures; full archive passed the MD5, SHA-256 sidecar and gzip checks). DS-P5-07 cross-check by dataset-engineer on 2026-11-12: shasum -a 256 of the local archive equals the human-reported value and the .sha256 sidecar, and fetch-dblp.sh --verify passed (110 checks, 0 failures; 'full release verified: md5, sha256 sidecar, gzip -t')."
    retrieval:
      script: "datasets/scripts/fetch-dblp.sh"
      dry_run_command: "datasets/scripts/fetch-dblp.sh --dry-run"
      sample_command: "datasets/scripts/fetch-dblp.sh --sample"
      verify_command: "datasets/scripts/fetch-dblp.sh --verify"
      full_command: "SCHOLARCHAIN_CONFIRM_FULL_DOWNLOAD=dblp-2026-10-03 datasets/scripts/fetch-dblp.sh --full"
      full_download_by_default: false
      full_transfer_bounds: "RV-P5-02 finding 1 (DS-P5-04), constants in datasets/scripts/lib-datasets.sh: curl --connect-timeout 30 (seconds to open the connection), --speed-limit 1024 --speed-time 120 (a transfer slower than 1024 bytes/s for 120 consecutive seconds is a stall), --max-filesize 2000000000, https only (also on redirects). There is deliberately no total --max-time, so a slow but healthy 1.03 GB transfer is never cut off. A connect timeout or stall makes curl exit 28; the script exits 28 and keeps the .part file for resume. DS-P5-06 (RV-P5-07 NIT-5): -q is curl's first argument, so ~/.curlrc is not read (CURL_HOME and proxy environment variables still apply). DS-P5-06 (RV-P5-07 MINOR-1): before any network access, and again before the transfer and before the rename, the run refuses with exit 2 when datasets/downloads itself, any path component below it down to the release file, the release file, its .part, its .sha256 or its .sha256.tmp is a symbolic link (tested with -L, which never follows the link); a link is never followed, deleted or written through. The sidecar temporary file is created with noclobber (O_EXCL)."
      full_failure_behavior: "RV-P5-02 finding 2 (DS-P5-04). On every curl failure the .part file is KEPT and a RECOVERY line names its path and the next step: exit 28 (stall or connect timeout) re-run to resume; HTTP 416 (range not satisfiable: the .part is already at least the release length but its MD5 is not the pin) or curl exit 33 (server will not resume) delete the .part by hand (rm <path>) and re-run; exit 63 (over the size cap) stop and report. A .part is never deleted automatically after a failed transfer, because the exact byte size of the release is not published (size.expected.uncompressed and the compressed byte count are UNVERIFIED), so the script cannot prove a .part is complete. The one documented automatic deletion: when curl reports the transfer COMPLETE and the MD5 (or gzip -t) check then fails, the bytes are the whole response and wrong, resuming cannot repair them, so the .part is deleted and the message says so. A .part that already matches the MD5 pin is not requested again. DS-P5-05 additions: an HTTP 416 reply is handled as the 416 failure even when curl exits 0 (exit 22, .part kept, manual step printed); the printed rm step is shell-escaped (printf %q; RV-P5-03 N3); if the MD5 tool is missing or fails, the run refuses before the transfer (ds_need_md5) or, after it, keeps the .part unchecked and undeleted (RV-P5-03 N4); the sha256 sidecar is written through a temporary file and mv, and a final file left without its sidecar by an interrupted run is re-checked (MD5 pin, gzip -t) and only then given its sidecar, without a new download; a file without a sidecar that fails the checks is left in place and replaced only by a new download that passes both (RV-P5-02 nit 12); the final log line states the bytes actually transferred in this run (RV-P5-03 N5). DS-P5-06 (RV-P5-07 NIT-5): the HTTP 416 message depends on what the MD5 check of the .part found before the request: an MD5 that is not the pin gives the manual rm step; an MD5 that could not be computed says so, claims no mismatch and says not to delete the .part before the MD5 tool is fixed; no .part checked gives re-run first, rm only if the error repeats. A refused symbolic link exits 2 with a message naming the link (see full_transfer_bounds)."
      raw_zone_upload: "Out of scope for dataset-engineer. Upload of the verified file to raw_prefix is done by the approved pipeline script (infra-engineer authors, deploy-engineer or human runs)."
    format:
      file_format: "XML validated by dblp.dtd (one root element dblp, one child element per record)"
      compression: "gzip"
      encoding: "UNVERIFIED: XML declaration of the full dump not read. Non-ASCII characters use named entities declared in dblp.dtd."
    size:
      expected:
        compressed_display: "1.03 GB"
        compressed_source: "https://drops.dagstuhl.de/entities/artifact/10.4230/dblp.xml.2026-10-03 (read 2026-10-29)"
        rolling_file_listing: "dblp.xml.gz 1.0G, last modified 2026-10-28 23:28 (https://dblp.org/xml/, read 2026-10-29)"
        uncompressed_bytes: "UNVERIFIED: not published on the pages read"
        record_count: "UNVERIFIED: not published on the pages read"
      observed:
        bytes: 1107081001
        status: "observed-by-human"
        file: "datasets/downloads/dblp/full/dblp-2026-10-03.xml.gz (git-ignored)"
        observed_on: "2026-11-12"
        source: "Byte count reported by the human from the local file (decisions-12.md). dataset-engineer could not measure the byte count with an allowlisted command in DS-P5-07. Its own SHA-256 of the same file matched the recorded our_sha256, and fetch-dblp.sh --verify matched the MD5 pin. So the bytes measured are the pinned release, but dataset-engineer did not observe the count itself."
    raw_prefix: "s3://{raw_bucket}/raw/dblp/snapshot_date=2026-10-03/"
    integrity:
      method: "Compare the upstream MD5 (release .md5 file) before upload, then compute SHA-256 locally and record it here and as S3 object metadata. Run gzip -t."
      upstream_checksum:
        algorithm: md5
        value: "cbd329100ea1bbb2873fa2f6d414ea00"
        source: "https://drops.dagstuhl.de/storage/artifacts/dblp/xml/2026/dblp-2026-10-03.xml.gz.md5"
        transcription_note: "Read twice on 2026-10-29 (release page and .md5 file), identical both times. fetch-dblp.sh --sample re-reads the live .md5 file and fails on any difference."
        local_match: "MATCHED on 2026-11-12: the downloaded archive's MD5 equals this pin (fetch-dblp.sh --verify, run by the human and again by dataset-engineer in DS-P5-07)."
      our_sha256: "20e45961bec5610dc07b8e932ccd27a2387534cfa12c92a24289fe873aebe969"
      our_sha256_note: "SHA-256 of datasets/downloads/dblp/full/dblp-2026-10-03.xml.gz (1107081001 bytes), computed on 2026-11-12. Three values are identical: the human report (decisions-12.md), the .sha256 sidecar written by fetch-dblp.sh --full, and dataset-engineer's shasum -a 256 run in DS-P5-07. The manifest validator checks only the format of this field. It does not compare it with the local archive; fetch-dblp.sh --verify compares the archive with its sidecar and the MD5 pin. See validation_commands for the manual check."
      etag_policy: "S3 ETags are not used as content hashes (multipart uploads produce non-MD5 ETags). Integrity is the recorded SHA-256 plus the upstream MD5."
    schema_version: "dblp-raw/1.0.0"
    upstream_schema_version: "dblp.dtd, latest change 'DTD changes of June 28, 2023' (https://dblp.org/xml/CHANGES.txt)"
    schema_notes: "datasets/schemas/dblp.md"
    subset_rule: "Smoke run: the 4 records of datasets/samples/dblp/dblp-sample.xml, then the first 10,000 publication records in document order. Functional run (spec minimum 100,000 works): publication records (article, inproceedings) with 2015 <= year <= 2024, restricted to a human-approved list of venue streams so that collaboration communities stay intact. The venue list is an open question for the human, and until it is decided the fallback is all article and inproceedings records with 2015 <= year <= 2024. Scale experiment: all publication records of the pinned release. www, person and data records are never treated as works."
    update_strategy: "dblp publishes dated monthly releases. Each run pins one release. A new release is fetched as a new snapshot_date prefix and the old prefix is never overwritten. Upstream publishes no record-level diff, so downstream jobs recompute from the new snapshot and compare counts."
    linkage_fields:
      - "dblp_key"
      - "doi (from ee, https://doi.org/ prefix stripped, lowercased)"
      - "author_orcid (author/@orcid)"
      - "normalized_title"
      - "normalized_author_sequence"
      - "year"
      - "venue (journal or booktitle)"
      - "volume, number, pages"
    source_identifiers:
      - name: dblp_record_key
        format: "slash-separated opaque path, e.g. <type-stream>/<venue>/<local> (observed pattern, no official grammar found)"
        example: "journals/tocs/CorbettDEFFFGGHHHKKLLMMNQRRSSTWW13"
      - name: dblp_person_pid
        format: "pid string such as 11/3019, 69/6042-1, d/JeffreyDean; URI https://dblp.org/pid/<pid> (observed via dblp SPARQL; representation inside the XML dump UNVERIFIED)"
        example: "11/3019"
      - name: doi
        format: "https://doi.org/<10.prefix/suffix> inside ee elements"
        example: "https://doi.org/10.1145/3447741"
      - name: orcid
        format: "author/@orcid attribute (bare iD assumed; form UNVERIFIED)"
        example: "0000-0002-2814-962X"
    personal_data:
      contains_personal_data: true
      fields:
        - "author and editor names (with homonym suffixes)"
        - "author ORCID iDs where dblp records them"
        - "affiliation notes inside www person records (not extracted)"
      handling:
        - "Keep names and ORCID iDs only for linkage and attribution; do not extract www affiliation notes unless a later work order requires them."
        - "Names are public bibliographic data; never infer identity from a name match."
    limitations:
      - "A matching author name is not sufficient evidence of author identity."
      - "Homonyms are disambiguated by dblp with 4-digit suffixes (e.g. 'Christopher Frost 0001'); undisambiguated homonyms and split identities remain."
      - "ORCID coverage on author elements is partial (none of the 26 Spanner signatures carry one)."
      - "Not every record has a DOI; ee may be a publisher URL (e.g. USENIX OSDI 2006)."
      - "Titles end with a period and may carry editorial notes such as '(Awarded Best Paper!)'."
      - "pages may hold an article number (Spanner: 8) instead of a page range."
      - "The XML dump contains non-publication records (www, person, data) that must be filtered."
      - "Records were sampled through the dblp SPARQL endpoint because dblp.org/rec/*.xml returned a bot-protection page to the verification tool."
      - "Per-record dblp XML is never requested by any script (DS-P5-03): https://dblp.org/robots.txt (read 2026-11-05) disallows /rec/xml, /*.xml and /*.json. fetch-dblp.sh --sample fetches only dblp.dtd (https://dblp.org/xml/dblp.dtd, not disallowed) and the DROPS release .md5 file."
    validation_commands:
      - "datasets/scripts/validate-manifest.sh --verify"
      - "datasets/scripts/fetch-dblp.sh --verify"
      - "gzip -t datasets/downloads/dblp/full/dblp-2026-10-03.xml.gz"
      - "shasum -a 256 datasets/downloads/dblp/full/dblp-2026-10-03.xml.gz"
      - "wc -c < datasets/downloads/dblp/full/dblp-2026-10-03.xml.gz"
    validation_command_notes:
      - command: "shasum -a 256 datasets/downloads/dblp/full/dblp-2026-10-03.xml.gz"
        expect: "20e45961bec5610dc07b8e932ccd27a2387534cfa12c92a24289fe873aebe969"
        expect_field: "integrity.our_sha256"
        check: "Manual. Compare the printed hash with expect. The manifest validator checks only the format of integrity.our_sha256, not the local file."
      - command: "wc -c < datasets/downloads/dblp/full/dblp-2026-10-03.xml.gz"
        expect: "1107081001"
        expect_field: "size.observed.bytes"
        check: "Manual. Compare the printed byte count with expect. The value was observed by the human (decisions-12.md), not by dataset-engineer, and the manifest validator does not measure the local file."
    owning_agent: dataset-engineer
    samples:
      - "datasets/samples/dblp/dblp-sample.xml"
    unverified:
      - item: "format.encoding"
        reason: "The XML declaration of the full dump was not read; only the DTD and listings were fetched. An attempt to read https://dblp.org/xml/README.txt for an encoding statement on 2026-11-05 (DS-P5-04) did not complete (tool usage limit). The extractor fixture therefore tests the plausible declarations ISO-8859-1, UTF-8 and US-ASCII; the real one is still unknown."
      - item: "exact compressed byte size of dblp-2026-10-03.xml.gz (upstream-published value)"
        reason: "Only the display value 1.03 GB is published on the pages read, so fetch-dblp.sh --full cannot prove that a .part file is complete and never deletes one after a failed transfer (retrieval.full_failure_behavior). The local file that matches the MD5 pin measures 1107081001 bytes (size.observed, reported by the human on 2026-11-12). That is our observation; upstream has not published the size."
      - item: "size.expected.uncompressed_bytes and record_count"
        reason: "Not stated on any official page read on 2026-10-29."
      - item: "source_identifiers.orcid attribute value form"
        reason: "dblp.org/rec/*.xml was blocked by bot protection; SPARQL returns the iD as an https://orcid.org/ URI."
      - item: "source_identifiers.dblp_person_pid representation in the XML dump"
        reason: "Only observed through dblp RDF/SPARQL."
