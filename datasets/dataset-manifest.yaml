    format:
      file_format: "JSON Lines, one entity object per line, partitioned as data/jsonl/<entity>/updated_date=YYYY-MM-DD/part_NNNN.gz (up to 400,000 records per part)"
      compression: "gzip"
      encoding: "UTF-8 (JSON)"
    size:
