# Bounded EMR Spark run configuration (scholarchain.bounded-spark-config.v1; owner: infra-engineer).
# Read (never sourced) by scripts/run-bounded-spark.sh. key=value, every key exactly once, no defaults;
# any REPLACE-ME value refuses. Local paths: repository-relative or ~/ (home-relative).
# Account, Region and operator profile come from ../env.conf; bucket and cluster names are derived.
# Pins must equal ../emr-run/terraform.tfvars (checked against the cluster's bootstrap action).
config_version=scholarchain.bounded-spark-config.v1
environment=dev
# attempt=1 was used by submission a1-3752b3deafaabde2 (run record written, add-steps refused
# client-side, no step; IE-P6-10). Each --execute that writes a run record uses a new attempt.
attempt=2
emr_release_label=emr-7.14.0
instance_type=m5.xlarge
max_instances=2
# Idle auto-termination of the emr-run cluster (before --execute and after a successful step); must
# not exceed ../emr-run/terraform.tfvars idle_timeout_seconds. --execute must start within it.
max_idle_timeout_seconds=900
# Cluster-side wall bound of the one step (/usr/bin/timeout -k 60 <this x 60 s>, TERMINATE_CLUSTER).
step_timeout_minutes=30
poll_interval_seconds=30
# Verified us-east-1 EC2 0.192 + EMR 0.048 per instance-hour (emr-docs-research-03.md).
instance_hour_price_usd=0.24
max_cost_usd=1
# Commit the job jar is built from and its sha256. The jar is the create-once copy that passed
# sbt sparkSubmitLocal attempt-4 (BE-P6-10, code scope build.sbt project modules/core modules/spark
# raw-byte equal to HEAD 148b4b9; inventory.txt). code_version must stay an ancestor of the run HEAD,
# and that code scope must be unchanged between it and the run HEAD. Both rules are enforced by
# scripts/run-bounded-spark.sh in every mode (IE-P6-04; scope check CR-P6-37 m1, IE-P6-04 repair 01).
code_version=148b4b91bc904a63680b94f91f275173f743c4b6
job_jar_local_path=target/spark-submit-local/attempt-4/job/scholarchain-spark-jobs-0.1.0.jar
job_jar_sha256=cd62042c642b11a62be290128cc97b28ed03b9b55d1808faf8b5fed1dbaf597a
# Spark distribution: sha512 pinned (BE-P6-09, verified); sha256 for the S3 integrity checksum
# (`shasum -a 256` of the cached file by the human, human-shasum-2026-11-18.md).
spark_dist_local_path=target/spark-dist/spark-3.5.5-bin-hadoop3-scala2.13.tgz
spark_dist_sha512=a462656d2a87afcf81f24e4dea9a99e6666ed5c8ff7ba0cc9c936188498c549cf852d0ebb475325761d6cf645d1184d527be9a609503d587bb47d5532b533aa1
spark_dist_sha256=3581db56cb57cc94d83186d468be8233adebc27a94136540731b35839b09888f
# Runtime jars: the copies on the sparkSubmitLocal attempt-4 class path, sha256 from its inventory.txt.
scala_library_local_path=target/spark-submit-local/attempt-4/runtime-jars/scala-library-2.13.16.jar
scala_library_sha256=1ebb2b6f9e4eb4022497c19b1e1e825019c08514f962aaac197145f88ed730f1
hadoop_aws_local_path=target/spark-submit-local/attempt-4/runtime-jars/hadoop-aws-3.3.4.jar
hadoop_aws_sha1=a65839fbf1869f81a1632e09f415e586922e4f80
hadoop_aws_sha256=53f9ae03c681a30a50aa17524bd9790ab596b28481858e54efd989a826ed3a4a
sdk_bundle_local_path=target/spark-submit-local/attempt-4/runtime-jars/aws-java-sdk-bundle-1.12.262.jar
sdk_bundle_sha256=873fe7cf495126619997bec21c44de5d992544aea7e632fdc77adb1a0915bae5
analysis_config_path=modules/spark/src/test/resources/scholarchain/spark/dev-run-01/analysis-dev.conf
benchmark_pairs_path=modules/spark/src/test/resources/scholarchain/spark/dev-run-01/benchmark-pairs-dev.v1.json
# Dev archive (project/spark-it.properties); uploaded to s3://<data bucket>/input/<input_name>/.
input_name=dev-run-01
input_archive_home_relative=ScholarChain-archive/phase-06/dev-run-01
# sha256 of the input-tree manifest (relative path, bytes, sha256 per file). Value computed by the
# first --dry-run at HEAD b41b249 (82 files, 1833950 bytes; IE-P6-04 repair 02).
input_tree_sha256=0bb19182973e905c5267c1b05a451162f44a0069aa0496218be2d6eb6f5478f1
curated_run=modules/hadoop/target/local-pipeline/er-candidates/dev/attempt-1/curated/hadoop/snapshot=dblp-2026-10-03/run=2881724b5c86b561a235836d51946fbd884beed36a14f929b27c278cb5de8baa
