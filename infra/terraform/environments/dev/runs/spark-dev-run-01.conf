grouping_run=target/local-runs/dev/er-assignments/run=84dd896fda43977b934008f10955191e78c2b93b80ec57c00f55dbb137dbd7d2
# Job bounds (BE-P6-09 EMR command). partitions=2 decided by spark-engineer (SP-P6-08 decision 1):
# same physical shape as the sparkSubmitLocal attempt-4 gate and sparkIT (--partitions 2), fills the
# wrapper's 2 executors x 1 core in one wave; P is not part of the run manifest or run ID.
partitions=2
checkpoint_interval=2
max_tree_entries=20000
max_tree_depth=4
max_driver_validation_rows=2000
max_driver_validation_bytes=67108864
max_metadata_bytes=1048576
