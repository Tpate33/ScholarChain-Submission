# Environment configuration for `dev` (owner: infra-engineer). Read (never sourced) by scripts/plan.sh,
# scripts/deploy.sh, scripts/cleanup.sh. Format: key=value, characters A-Z a-z 0-9 . _ - / : only, every
# key exactly once, no defaults; any REPLACE-ME value refuses. The environment name `dev` is a
# PLACEHOLDER pending ratification of the environment list (@env, @env-nonprod).
# Values filled by infra-engineer (IE-P6-03) from the human's messages of 2026-11-18
# (docs/agent-runs/phase-06/prompt-account-checks.md and the setup message). The human reviews and
# commits this file before the first plan.
config_version=scholarchain.environment-config.v2
environment=dev
# Account of the verified identity arn:aws:iam::663570374448:user/scholarchain-admin (human, CLI
# profile scholarchain-login, 2026-11-18).
aws_account_id=663570374448
# Region chosen by the human (setup message 2026-11-18).
aws_region=us-east-1
# AZ ID. The human's describe-instance-type-offerings (m5.xlarge, us-east-1) listed use1-az6, use1-az2,
# use1-az1, use1-az5, use1-az4. use1-az4 is chosen: it is in that list, and it is the example already
# used by base's variable description and validation message. No capacity or price difference between
# the five is known (UNVERIFIED); KMS interface endpoint availability in this AZ ID is UNVERIFIED (a
# missing endpoint AZ fails the emr-run apply, before any cluster exists). Changing it later replaces the
# base subnet, which scripts/deploy.sh refuses (destroy and re-create base through scripts/cleanup.sh).
availability_zone_id=use1-az4
# Local profiles (no access keys; see infra/terraform/README.md). deploy: scholarchain-admin, the
# credential_process wrapper around the `aws login` profile scholarchain-login (the human's IAM user,
# R4); no script calls scholarchain-login directly (deploy.sh names it in its sign-in hint only).
# readonly: role scholarchain-dev-readonly (R5, exists after base). operator: role
# scholarchain-dev-operator (R3). Both roles use source_profile = scholarchain-admin.
aws_readonly_profile=scholarchain-readonly
aws_deploy_profile=scholarchain-admin
aws_operator_profile=scholarchain-operator
# The human's IAM user, verified with `aws sts get-caller-identity --profile scholarchain-login`.
admin_principal_arn=arn:aws:iam::663570374448:user/scholarchain-admin
# Local state of infra/terraform/bootstrap, relative to $HOME (outside the repository).
bootstrap_state_home_relative=ScholarChain-tfstate/bootstrap/terraform.tfstate
# Required tags (owner and expiration from the human's setup message 2026-11-18). After 2026-11-26
# plan.sh, deploy.sh and run-bounded-spark.sh refuse until the date is moved (a reviewed commit);
# cleanup.sh still runs and prints a NOTE (IE-P6-03), so teardown is never blocked by the date.
course=cs441
project=scholarchain
owner=taufeeq
expiration=2026-11-26
