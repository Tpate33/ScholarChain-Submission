# Smoke-test endpoint contract for `dev` (owner: infra-engineer, IE-P13-02). Read (never sourced) by
# scripts/smoke-test.sh, which requires this file committed and unmodified. Format: key=value, characters
# A-Z a-z 0-9 . _ - / : only, every key exactly once, no defaults; any REPLACE-ME value refuses (exit 3).
#
# PLACEHOLDERS: the two base URLs are not known before the runtime stack is applied. After the
# human-approved apply, take `query_base_url` and `evidence_base_url` from the runtime output
# `api_endpoint` (terraform -chdir=infra/terraform/environments/dev/runtime output api_endpoint) and
# replace the two REPLACE-ME values below in a reviewed commit. Shape: http://<alb dns name>:8080 and
# http://<alb dns name>:8081 (HTTP listeners), or https://<certificate domain>:443 and :8443 (HTTPS).
# No path, query or credentials (smoke-test.sh refuses them). The ALB admits only api_ingress_cidrs from
# env.local.conf, so run the smoke test from that network.
config_version=scholarchain.smoke-config.v1
environment=dev
query_base_url=http://REPLACE-ME-alb-dns-name-from-api_endpoint:8080
evidence_base_url=http://REPLACE-ME-alb-dns-name-from-api_endpoint:8081
# Committed bounded query (mode "sync"): one coauthor lookup, one hop.
query_body_path=infra/terraform/environments/dev/smoke-query.json
# Per-request connect bound, per-request total bound (a sync Graph-RAG answer; the ALB idle timeout is
# 120 s), and the overall deadline of all eight requests.
connect_timeout_seconds=10
request_timeout_seconds=90
max_total_seconds=300
